<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d0c">
<title>Fitness V1</title>
<style>
:root{--bg:#0b0d0c;--card:#151917;--card2:#1c211e;--text:#f5f7f6;--muted:#99a29d;--accent:#b7ff3c;--line:#2a302d;--danger:#ff7a7a}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{min-height:100vh}.app{max-width:520px;margin:0 auto;min-height:100vh;padding:18px 16px 95px}
h1{font-size:28px;margin:0}.sub{font-size:13px;color:var(--muted);margin-top:4px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.icon{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:12px;padding:9px 11px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.wide{grid-column:1/-1}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px}.label{color:var(--muted);font-size:12px}
.value{font-size:24px;font-weight:800;margin:6px 0}.goal{font-size:12px;color:var(--muted)}
.progress{height:7px;background:#2a302d;border-radius:99px;overflow:hidden;margin-top:10px}.bar{height:100%;background:var(--accent);width:0}
button{border:0;border-radius:11px;padding:10px 13px;background:var(--accent);color:#10140e;font-weight:800;cursor:pointer}
.secondary{background:var(--card2);border:1px solid var(--line);color:var(--text)}
button:disabled{opacity:.45;cursor:not-allowed}
.screen{display:none}.screen.active{display:block}.list{display:grid;gap:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.pill{border-radius:999px;padding:5px 8px;background:#25301f;color:#ccef9c;font-size:11px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
input,select{width:100%;padding:12px;border-radius:11px;border:1px solid var(--line);background:var(--card2);color:var(--text);font-size:16px;margin:5px 0 12px}
textarea{width:100%;min-height:100px}
.tabs{display:flex;gap:7px;overflow:auto;margin-bottom:10px}.tabs button{white-space:nowrap}
.exercise-title{font-weight:800}.setrow{display:grid;grid-template-columns:48px 1fr 1fr 42px;gap:6px;align-items:center;margin-top:7px}
.setrow input{margin:0;padding:9px}.setnum{color:var(--muted);font-size:12px}.check{padding:9px}
.notice{background:#182218;color:#cdeaa6;border-radius:12px;padding:11px;font-size:12px;margin-top:12px}
nav{position:fixed;bottom:0;left:0;right:0;z-index:10;display:flex;justify-content:center;gap:2px;padding:9px 7px calc(9px + env(safe-area-inset-bottom));background:rgba(11,13,12,.97);border-top:1px solid var(--line)}
nav button{background:transparent;color:var(--muted);font-size:11px;padding:7px 10px}nav button.active{color:var(--accent)}
.small{font-size:11px;color:var(--muted)}.exercise-actions{display:flex;gap:7px}.exercise-icon{width:40px;height:40px;padding:0;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;font-size:20px;background:var(--card2);border:1px solid var(--line)}.exercise-icon.replace{color:var(--accent)}.exercise-icon.skip{color:var(--text)}.photo-box{height:160px;border:1px dashed #3c443f;border-radius:15px;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.68);z-index:50;display:flex;align-items:flex-end}.sheet{width:100%;max-width:520px;margin:auto 0 0;background:#171b18;border:1px solid var(--line);border-radius:22px 22px 0 0;padding:18px 16px 25px}.choice{margin-top:8px}.choice button{width:100%;text-align:left;background:var(--card2);color:var(--text);border:1px solid var(--line);padding:13px;border-radius:12px}.meal-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.food-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}.food-row:last-child{border-bottom:0}.food-name{font-size:13px}.food-macro{font-size:11px;color:var(--muted)}.mini{padding:7px 9px;font-size:11px}.meal-total{font-size:12px;color:#cdeaa6;margin-top:9px}.nutrition-sheet .choice button{display:flex;justify-content:space-between;align-items:center}.qty{display:grid;grid-template-columns:1fr 1fr;gap:8px}.qty input{margin:0}
</head>
<body>
<div class="app">

<section id="today" class="screen active">
  <div class="top">
    <div><h1>Today</h1><div class="sub" id="todayDate"></div></div>
    <button class="icon" onclick="editWeight()">⚖️</button>
  </div>
  <div class="grid">
    <div class="card"><div class="label">Weight</div><div class="value" id="weightVal">83.0 kg</div><div class="goal">Goal: <span id="weightGoal">75</span> kg</div><div class="progress"><div class="bar" id="weightBar"></div></div></div>
    <div class="card"><div class="label">Calories</div><div class="value" id="calVal">0</div><div class="goal">of <span id="calGoal">2300</span> kcal</div><div class="progress"><div class="bar" id="calBar"></div></div></div>
    <div class="card"><div class="label">Protein</div><div class="value" id="proteinVal">0 g</div><div class="goal">of <span id="proteinGoal">150</span> g</div><div class="progress"><div class="bar" id="proteinBar"></div></div></div>
    <div class="card"><div class="label">Steps</div><div class="value" id="stepsVal">0</div><div class="goal">of <span id="stepsGoal">10000</span></div><div class="progress"><div class="bar" id="stepsBar"></div></div></div>
    <div class="card"><div class="label">Water</div><div class="value" id="waterVal">0.0 L</div><div class="goal">Goal: 3.0 L</div><div class="progress"><div class="bar" id="waterBar"></div></div></div>
    <div class="card"><div class="label">Daily score</div><div class="value" id="scoreVal">0%</div><div class="goal">Simple consistency score</div></div>
    <div class="card wide">
      <div class="row">
        <div><div class="label">Today's Workout</div><div class="value" id="todayWorkout">Not started</div><div class="goal">3-day program: Upper / Legs / Upper</div></div>
        <button onclick="showScreen('workout')">OPEN</button>
      </div>
      <div class="actions">
        <button class="secondary" onclick="addWater(.25)">+250 mL</button>
        <button class="secondary" onclick="addSteps(1000)">+1,000 steps</button>
        <button class="secondary" onclick="addProtein(25)">+25 g protein</button>
        <button class="secondary" onclick="addCalories(250)">+250 kcal</button>
      </div>
    </div>
  </div>
  <div class="notice">Your current targets: 83 kg → 75 kg, 2,300 kcal, 150 g protein, 10,000 steps, 3 workouts/week, 2 runs/week, 7 hours sleep.</div>
</section>

<section id="workout" class="screen">
  <div class="top"><div><h1>Workout</h1><div class="sub" id="workoutSub">Upper / Chest Priority</div></div><button class="icon" onclick="resetWorkout()">↻</button></div>
  <div class="tabs">
    <button id="routineA" onclick="setRoutine('A')">A — Upper</button>
    <button id="routineB" class="secondary" onclick="setRoutine('B')">B — Legs</button>
    <button id="routineC" class="secondary" onclick="setRoutine('C')">C — Upper</button>
  </div>
  <div class="card">
    <div class="row"><div><div class="label" id="routineTitle">Upper / Chest Priority</div><div class="goal" id="routineMeta">8 exercises</div></div><span class="pill" id="workoutPill">Not started</span></div>
    <div class="actions"><button onclick="startRoutine()">START WORKOUT</button><button class="secondary" onclick="finishRoutine()">FINISH</button></div>
  </div>
  <div id="exerciseList" class="list" style="margin-top:10px"></div>
  <div class="notice">Warm-up sets are separate and never count toward working-set totals. Secondary movements use 2 working sets after the first exercise has prepared the muscle.</div>
</section>

<section id="nutrition" class="screen">
  <div class="top">
    <div><h1>Nutrition</h1><div class="sub">Your meals • 2,300 kcal • 150 g protein</div></div>
    <button class="icon" onclick="openFoodModal(-1)">＋</button>
  </div>

  <div class="grid">
    <div class="card"><div class="label">Calories</div><div class="value" id="nCal">0</div><div class="goal">of 2,300 kcal</div><div class="progress"><div class="bar" id="nCalBar"></div></div></div>
    <div class="card"><div class="label">Protein</div><div class="value" id="nProtein">0 g</div><div class="goal">of 150 g</div><div class="progress"><div class="bar" id="nProteinBar"></div></div></div>
  </div>

  <div id="mealList" class="list" style="margin-top:10px"></div>

  <div class="card" style="margin-top:10px">
    <div class="row"><div><div class="label">Quick Add</div><div class="goal">Saved foods you use often</div></div><button class="secondary" onclick="openFoodModal(-1)">＋ Add Food</button></div>
    <div class="actions">
      <button class="secondary mini" onclick="quickFood('Lean Fit Whey',120,23)">Whey • 120 / 23g</button>
      <button class="secondary mini" onclick="quickFood('3 Whole Eggs',210,18)">Eggs • 210 / 18g</button>
      <button class="secondary mini" onclick="quickFood('Chicken Breast 180g',297,56)">Chicken • 297 / 56g</button>
    </div>
  </div>

  <div class="notice">Every meal supports <b>− item</b>, <b>＋ item</b>, and <b>Replace Meal</b>. Replace can be for today; your saved meal structure can be updated later.</div>
</section>

<section id="progress" class="screen">
  <div class="top"><div><h1>Progress</h1><div class="sub">83 kg → 75 kg</div></div></div>
  <div class="tabs"><button>Weight</button><button class="secondary">Strength</button><button class="secondary">Measurements</button><button class="secondary">Photos</button></div>
  <div class="card"><div class="label">Goal journey</div><div class="value" id="journeyVal">0%</div><div class="progress"><div class="bar" id="journeyBar"></div></div><div class="small" id="journeyText">8.0 kg to goal</div></div>
  <div class="card" style="margin-top:10px"><div class="row"><div><div class="label">Weekly Check-In</div><div class="value" style="font-size:20px">Progress Photos</div></div><button onclick="alert('Weekly photo capture will be enabled in the Progress build.')">ADD</button></div><div class="actions"><div class="photo-box" style="flex:1">Front</div><div class="photo-box" style="flex:1">Side</div><div class="photo-box" style="flex:1">Back</div></div></div>
</section>

<section id="profile" class="screen">
  <div class="top"><div><h1>Profile</h1><div class="sub">Goals & preferences</div></div></div>
  <div class="card">
    <div class="label">Current weight (kg)</div><input id="pWeight" type="number" step="0.1">
    <div class="label">Goal weight (kg)</div><input id="pGoalWeight" type="number" step="0.1">
    <div class="label">Daily calories</div><input id="pCal" type="number">
    <div class="label">Daily protein (g)</div><input id="pProtein" type="number">
    <div class="label">Daily steps</div><input id="pSteps" type="number">
    <div class="label">Weekly workouts</div><input id="pWorkouts" type="number">
    <div class="label">Weekly runs</div><input id="pRuns" type="number">
    <div class="label">Sleep goal (hours)</div><input id="pSleep" type="number" step="0.1">
    <button onclick="saveProfile()">SAVE GOALS</button>
  </div>
</section>

</div>

<nav>
<button class="active" onclick="showScreen('today',this)">⌂<br>Today</button>
<button onclick="showScreen('workout',this)">🏋️<br>Workout</button>
<button onclick="showScreen('nutrition',this)">🍎<br>Nutrition</button>
<button onclick="showScreen('progress',this)">📈<br>Progress</button>
<button onclick="showScreen('profile',this)">👤<br>Profile</button>
</nav>


<div id="replaceModal" class="modal-backdrop" onclick="closeReplaceModal(event)" style="display:none">
  <div class="sheet" onclick="event.stopPropagation()">
    <div class="row">
      <div><h2 id="replaceHeading">Replace Exercise</h2><div class="sub">Choose a similar movement.</div></div>
      <button class="secondary" onclick="closeReplaceModal()">✕</button>
    </div>
    <div id="replaceOptions"></div>
    <div class="actions" style="margin-top:12px"><button class="secondary" onclick="customReplace()">＋ Custom exercise</button></div>
  </div>
</div>

<div id="foodModal" class="modal-backdrop nutrition-sheet" style="display:none" onclick="closeFoodModal(event)">
  <div class="sheet" onclick="event.stopPropagation()">
    <div class="row"><div><h2 id="foodModalTitle">Add Food</h2><div class="sub">Add it to one meal and track calories + protein.</div></div><button class="secondary" onclick="closeFoodModal()">✕</button></div>
    <div style="margin-top:12px">
      <div class="label">Food</div><input id="foodName" placeholder="Chicken breast">
      <div class="qty"><div><div class="label">Calories</div><input id="foodCal" type="number" placeholder="200"></div><div><div class="label">Protein (g)</div><input id="foodProtein" type="number" placeholder="30"></div></div>
      <div class="label">Meal</div><select id="foodMeal"><option value="0">Breakfast</option><option value="1">Lunch</option><option value="2">Post-workout</option><option value="3">Dinner</option></select>
      <button style="width:100%;margin-top:7px" onclick="saveFoodModal()">ADD FOOD</button>
    </div>
  </div>
</div>

<div id="replaceMealModal" class="modal-backdrop nutrition-sheet" style="display:none" onclick="closeReplaceMeal(event)">
  <div class="sheet" onclick="event.stopPropagation()">
    <div class="row">
      <div><h2 id="replaceMealTitle">Replace Meal</h2><div class="sub">Choose a meal for today.</div></div>
      <button class="secondary" onclick="closeReplaceMeal()">✕</button>
    </div>
    <div id="replaceMealChoices"></div>
    <div class="actions" style="margin-top:12px">
      <button class="secondary" onclick="customMealReplace()">＋ Custom meal</button>
    </div>
  </div>
</div>
<script>
const STORE='fitness-v1-real';
let state=JSON.parse(localStorage.getItem(STORE)||'null')||{
 weight:83,goalWeight:75,calGoal:2300,proteinGoal:150,stepsGoal:10000,workoutsGoal:3,runsGoal:2,sleepGoal:7,
 cal:0,protein:0,steps:0,water:0,workoutStatus:{A:'Not started',B:'Not started',C:'Not started'},
 routine:'A',sets:{}
};
const routines={
 A:{
  title:'Upper / Chest Priority',
  ex:[
   ['Incline Dumbbell Press',3,'6–10',true],['Flat Bench Press',2,'6–10',false],['Cable Chest Fly',2,'10–15',false],
   ['Lat Pulldown',3,'8–12',true],['Seated Cable Row',2,'8–12',false],
   ['Dumbbell Lateral Raise',3,'12–15',true],['Triceps Pushdown',3,'10–15',true],['Dumbbell Curl',3,'10–15',true]
  ]},
 B:{
  title:'Legs / Hard Session',
  ex:[
   ['Squat / Hack Squat',3,'6–10',true],['Leg Press',2,'10–12',false],['Leg Extension',2,'10–15',false],
   ['Romanian Deadlift',3,'8–12',true],['Leg Curl',2,'10–15',false],
   ['Calf Raise',3,'10–15',true],['Cable Crunch',2,'10–15',false]
  ]},
 C:{
  title:'Upper / Chest Priority',
  ex:[
   ['Flat Dumbbell Press',3,'6–10',true],['Incline Machine Chest Press',2,'8–12',false],['Cable Fly',2,'10–15',false],
   ['Chest-Supported Row',3,'8–12',true],['Lat Pulldown',2,'8–12',false],
   ['Seated Dumbbell Shoulder Press',3,'8–12',true],['Dumbbell Lateral Raise',2,'12–15',false],
   ['EZ-Bar Curl',3,'10–15',true],['Overhead Cable Triceps Extension',2,'10–15',false]
  ]}
};
const alt={
'Incline Dumbbell Press':['Incline Barbell Press','Incline Smith Machine Press','Incline Machine Chest Press'],
'Flat Bench Press':['Flat Dumbbell Press','Flat Machine Chest Press','Smith Machine Bench Press'],
'Cable Chest Fly':['Pec Deck / Machine Fly','Dumbbell Fly','Cable Crossover'],
'Lat Pulldown':['Assisted Pull-Up','Neutral-Grip Pulldown','Single-Arm Cable Pulldown'],
'Seated Cable Row':['Chest-Supported Row','Machine Row','Single-Arm Cable Row'],
'Dumbbell Lateral Raise':['Cable Lateral Raise','Lateral Raise Machine','Lean-Away Cable Raise'],
'Triceps Pushdown':['Rope Pushdown','Straight-Bar Pushdown','Single-Arm Cable Pushdown'],
'Dumbbell Curl':['EZ-Bar Curl','Cable Curl','Preacher Curl Machine'],
'Squat / Hack Squat':['Barbell Squat','Hack Squat','Smith Machine Squat'],
'Leg Press':['Hack Squat','Belt Squat','Smith Machine Squat'],
'Leg Extension':['Single-Leg Extension'],
'Romanian Deadlift':['Dumbbell Romanian Deadlift','Smith Machine Romanian Deadlift','45-Degree Back Extension'],
'Leg Curl':['Seated Leg Curl','Lying Leg Curl','Single-Leg Curl'],
'Calf Raise':['Seated Calf Raise','Leg Press Calf Raise','Single-Leg Calf Raise'],
'Cable Crunch':['Machine Crunch','Weighted Decline Crunch','Kneeling Rope Crunch'],
'Flat Dumbbell Press':['Flat Barbell Bench Press','Machine Chest Press','Smith Machine Bench Press'],
'Incline Machine Chest Press':['Incline Dumbbell Press','Incline Smith Machine Press','Incline Barbell Press'],
'Cable Fly':['Pec Deck / Machine Fly','Dumbbell Fly','Cable Crossover'],
'Chest-Supported Row':['Seated Cable Row','Machine Row','One-Arm Dumbbell Row'],
'Seated Dumbbell Shoulder Press':['Machine Shoulder Press','Smith Machine Shoulder Press','Arnold Press'],
'EZ-Bar Curl':['Dumbbell Curl','Cable Curl','Preacher Curl Machine'],
'Overhead Cable Triceps Extension':['Dumbbell Overhead Extension','EZ-Bar Skull Crusher','Single-Arm Cable Overhead Extension']
};
function persist(){localStorage.setItem(STORE,JSON.stringify(state));renderAll()}
function pct(a,b){return Math.max(0,Math.min(100,b?Math.round(a/b*100):0))}
function renderAll(){
  if(!state || typeof state!=='object') return;
  state.calGoal=Number(state.calGoal)||2300;
  state.proteinGoal=Number(state.proteinGoal)||150;
  state.stepsGoal=Number(state.stepsGoal)||10000;
 todayDate.textContent=new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});
 weightVal.textContent=state.weight.toFixed(1)+' kg';weightGoal.textContent=state.goalWeight;
 calVal.textContent=state.cal;calGoal.textContent=state.calGoal;proteinVal.textContent=state.protein+' g';proteinGoal.textContent=state.proteinGoal;
 stepsVal.textContent=state.steps.toLocaleString();stepsGoal.textContent=state.stepsGoal;waterVal.textContent=state.water.toFixed(1)+' L';
 calBar.style.width=pct(state.cal,state.calGoal)+'%';proteinBar.style.width=pct(state.protein,state.proteinGoal)+'%';stepsBar.style.width=pct(state.steps,state.stepsGoal)+'%';waterBar.style.width=pct(state.water,3)+'%';
 let journey=state.weight<=state.goalWeight?100:Math.round(Math.max(0,Math.min(100,(83-state.weight)/(83-state.goalWeight)*100)));weightBar.style.width=journey+'%';journeyBar.style.width=journey+'%';journeyVal.textContent=journey+'%';journeyText.textContent=Math.max(0,state.weight-state.goalWeight).toFixed(1)+' kg to goal';
 scoreVal.textContent=Math.round((Math.min(1,state.protein/state.proteinGoal)+Math.min(1,state.steps/state.stepsGoal)+Math.min(1,state.water/3)+(state.workoutStatus[state.routine]==='Completed'?1:0))/4*100)+'%';
 todayWorkout.textContent=state.workoutStatus[state.routine]==='Completed'?'Full Body '+state.routine+' ✓':(state.workoutStatus[state.routine]==='In progress'?'Full Body '+state.routine+' — In progress':'Not started');
 nCal.textContent=state.cal+' kcal';nProtein.textContent=state.protein+' g';
 pWeight.value=state.weight;pGoalWeight.value=state.goalWeight;pCal.value=state.calGoal;pProtein.value=state.proteinGoal;pSteps.value=state.stepsGoal;pWorkouts.value=state.workoutsGoal;pRuns.value=state.runsGoal;pSleep.value=state.sleepGoal;
 workoutSub.textContent=routines[state.routine].title;routineTitle.textContent=routines[state.routine].title;routineMeta.textContent=routines[state.routine].ex.length+' exercises';workoutPill.textContent=state.workoutStatus[state.routine];
 document.querySelectorAll('#workout .tabs button').forEach(b=>b.classList.add('secondary'));document.getElementById('routine'+state.routine).classList.remove('secondary');
 renderExercises();renderMeals();renderNutrition();
}
function showScreen(id,btn){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');if(btn){document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));btn.classList.add('active')}}
function editWeight(){let v=prompt('Today’s weight (kg)',state.weight);if(v!==null&&!isNaN(v)){state.weight=Number(v);persist()}}
function addWater(v){state.water=Math.min(10,state.water+v);persist()}
function addSteps(v){state.steps+=v;persist()}
function addProtein(v){state.protein+=v;persist()}
function addCalories(v){state.cal+=v;persist()}
function saveProfile(){state.weight=Number(pWeight.value)||state.weight;state.goalWeight=Number(pGoalWeight.value)||75;state.calGoal=Number(pCal.value)||2300;state.proteinGoal=Number(pProtein.value)||150;state.stepsGoal=Number(pSteps.value)||10000;state.workoutsGoal=Number(pWorkouts.value)||3;state.runsGoal=Number(pRuns.value)||2;state.sleepGoal=Number(pSleep.value)||7;persist();showScreen('today',document.querySelector('nav button'))}
function setRoutine(r){state.routine=r;renderAll()}
function startRoutine(){state.workoutStatus[state.routine]='In progress';persist()}
function finishRoutine(){if(state.workoutStatus[state.routine]!=='In progress')return alert('Start the workout first.');state.workoutStatus[state.routine]='Completed';persist();alert('Workout saved.');}
function resetWorkout(){state.workoutStatus[state.routine]='Not started';state.sets={};persist()}
function logSet(i,s,el){const key=state.routine+'-'+i;const w=el.parentElement.querySelector('.weight').value;const r=el.parentElement.querySelector('.reps').value;if(!state.sets[key])state.sets[key]={};state.sets[key][s]={weight:w,reps:r,done:!state.sets[key][s]?.done};if(state.workoutStatus[state.routine]==='Not started')state.workoutStatus[state.routine]='In progress';persist()}
function toggleWarm(i){const key=state.routine+'-'+i;if(!state.sets[key])state.sets[key]={};state.sets[key].warm=!state.sets[key].warm;persist()}

function renderExercises(){
 exerciseList.innerHTML=routines[state.routine].ex.map((e,i)=>{const key=state.routine+'-'+i,x=state.sets[key]||{},name=x.name||e[0],status=x.status||'Not started';
  const warm=e[3]?`<div class="actions"><button class="secondary" onclick="toggleWarm(${i})">🔥 Warm-up ${x.warm?'✓':''}</button></div>`:'';
  let rows='';for(let s=0;s<e[1];s++){let q=x[s]||{};rows+=`<div class="setrow"><div class="setnum">Set ${s+1}</div><input class="weight" type="number" step="0.5" placeholder="kg" value="${q.weight||''}"><input class="reps" type="number" placeholder="reps" value="${q.reps||''}"><button class="check ${q.done?'':'secondary'}" onclick="logSet(${i},${s},this)">${q.done?'✓':'OK'}</button></div>`}
  return `<div class="card"><div class="row"><div><div class="exercise-title">${i+1}. ${name}</div><div class="sub">${e[1]} working sets • ${e[2]} reps • ${status}</div><div class="small">Tap ⋯ for smart alternatives or skip</div></div><div class="exercise-actions"><button class="exercise-icon replace" title="Replace exercise" onclick="openReplaceModal(${i})">↻</button><button class="exercise-icon skip" title="Skip exercise" onclick="skipExercise(${i})">→</button></div></div>${warm}<div style="margin-top:9px">${rows}</div></div>`;
 }).join('')
}

let replacingExerciseIndex=null;
function skipExercise(i){
  const key=state.routine+'-'+i;
  state.sets[key]={...(state.sets[key]||{}),status:'Skipped'};
  persist();
}
function openReplaceModal(i){
  replacingExerciseIndex=i;
  const key=state.routine+'-'+i;
  const current=state.sets[key]?.name||routines[state.routine].ex[i][0];
  const opts=alt[current]||[];
  replaceHeading.textContent='Replace '+current;
  replaceOptions.innerHTML=opts.map(o=>`<div class="choice"><button onclick="chooseReplacement(${JSON.stringify(o)})">${o}</button></div>`).join('');
  replaceModal.style.display='flex';
}
function chooseReplacement(rep){
  const i=replacingExerciseIndex,key=state.routine+'-'+i;
  state.sets[key]={...(state.sets[key]||{}),name:rep,status:'Replaced for today'};
  closeReplaceModal();persist();
}
function customReplace(){
  const rep=prompt('Replacement exercise name','');
  if(rep)chooseReplacement(rep);
}
function closeReplaceModal(evt){
  if(!evt || evt.target===replaceModal)replaceModal.style.display='none';
}

const meals=[
 ['Breakfast',['3 whole eggs','Overnight oats','Whey protein','Granola','Peanut butter','Almonds']],
 ['Lunch',['180 g chicken breast','Corn','Onion','Greek yogurt','Salsa','Zero-sugar 7UP']],
 ['Post-workout',['Lean Fit Whey']],
 ['Dinner',['Grilled chicken wings','Seasoning']]
];
const mealTemplates=[
 {name:'Breakfast',items:[
  {name:'3 whole eggs',cal:210,protein:18},
  {name:'Overnight oats',cal:300,protein:18},
  {name:'Whey protein',cal:120,protein:23},
  {name:'Granola',cal:120,protein:3},
  {name:'Peanut butter',cal:95,protein:4},
  {name:'Almonds',cal:80,protein:3}
 ]},
 {name:'Lunch',items:[
  {name:'Chicken breast 180g',cal:297,protein:56},
  {name:'Corn',cal:80,protein:3},
  {name:'Onion',cal:30,protein:1},
  {name:'Greek yogurt',cal:100,protein:10},
  {name:'Salsa',cal:25,protein:1},
  {name:'Zero-sugar 7UP',cal:0,protein:0}
 ]},
 {name:'Post-workout',items:[{name:'Lean Fit Whey',cal:120,protein:23}]},
 {name:'Dinner',items:[{name:'Grilled chicken wings',cal:500,protein:45},{name:'Seasoning',cal:0,protein:0}]}
];
if(!Array.isArray(state.meals) || !state.meals.every(m=>m && typeof m==='object' && Array.isArray(m.items))){
  state.meals=mealTemplates.map(m=>({name:m.name,items:m.items.map(x=>({...x}))}));
}
state.meals=state.meals.map(m=>({name:String(m.name||'Meal'),items:Array.isArray(m.items)?m.items:[]}));
function mealTotals(meal){return meal.items.reduce((a,x)=>({cal:a.cal+(Number(x.cal)||0),protein:a.protein+(Number(x.protein)||0)}),{cal:0,protein:0})}
function nutritionTotals(){return state.meals.reduce((a,m)=>{const t=mealTotals(m);return {cal:a.cal+t.cal,protein:a.protein+t.protein}},{cal:0,protein:0})}
function addFoodToMeal(mi){
  const name=prompt('Food name','Greek yogurt'); if(!name)return;
  const cal=Number(prompt('Calories',100)); if(isNaN(cal))return;
  const protein=Number(prompt('Protein (g)',10)); if(isNaN(protein))return;
  state.meals[mi].items.push({name,cal,protein});persist();
}
function removeFoodFromMeal(mi){
  const items=state.meals[mi].items;if(!items.length)return;
  const n=Number(prompt('Remove item #:\n\n'+items.map((x,i)=>`${i+1}. ${x.name}`).join('\n'),1))-1;
  if(Number.isInteger(n)&&n>=0&&n<items.length){items.splice(n,1);persist();}
}
let replacingMealIndex=null;
const mealOptions=[
 {name:'Greek Yogurt Oats',items:[{name:'Greek yogurt',cal:150,protein:15},{name:'Oats',cal:225,protein:8},{name:'Whey',cal:120,protein:23},{name:'Berries',cal:70,protein:1}]},
 {name:'Eggs + Toast',items:[{name:'3 whole eggs',cal:210,protein:18},{name:'Whole grain toast',cal:200,protein:8}]},
 {name:'Chicken Bowl',items:[{name:'Chicken breast 180g',cal:297,protein:56},{name:'Rice',cal:250,protein:5},{name:'Vegetables',cal:80,protein:4}]},
 {name:'Protein Smoothie',items:[{name:'Whey',cal:120,protein:23},{name:'Banana',cal:105,protein:1},{name:'Milk',cal:120,protein:8}]},
 {name:'Steak + Potatoes',items:[{name:'Lean steak',cal:350,protein:45},{name:'Potatoes',cal:220,protein:5},{name:'Vegetables',cal:70,protein:3}]}
];
function replaceMeal(mi){
  replacingMealIndex=mi;
  const modal=document.getElementById('replaceMealModal');
  const title=document.getElementById('replaceMealTitle');
  const choices=document.getElementById('replaceMealChoices');
  title.textContent='Replace '+state.meals[mi].name;
  choices.innerHTML=mealOptions.map((o,i)=>`<div class="choice"><button onclick="chooseMealReplacement(${i})">${o.name}<span class="small">${o.items.length} items</span></button></div>`).join('');
  modal.style.display='flex';
}
function chooseMealReplacement(i){
  const opt=mealOptions[i]; if(!opt)return;
  const mi=replacingMealIndex;
  state.meals[mi]={name:opt.name,items:opt.items.map(x=>({...x})),replacedToday:true};
  closeReplaceMeal();persist();
}
function customMealReplace(){
  const mi=replacingMealIndex,name=prompt('New meal name',state.meals[mi].name);
  if(!name)return;
  state.meals[mi]={name,items:[],replacedToday:true};
  closeReplaceMeal();persist();
}
function closeReplaceMeal(evt){
  const modal=document.getElementById('replaceMealModal');
  if(!evt||evt.target===modal)modal.style.display='none';
}
function quickFood(name,cal,protein){openFoodModal(-1,{name,cal,protein})}
let pendingFood=null;
function openFoodModal(mi,preset=null){
  pendingFood={mi,preset};
  const modal=document.getElementById('foodModal');
  document.getElementById('foodModalTitle').textContent=mi>=0?'Add food to '+state.meals[mi].name:'Add Food';
  document.getElementById('foodName').value=preset?.name||'';
  document.getElementById('foodCal').value=preset?.cal??'';
  document.getElementById('foodProtein').value=preset?.protein??'';
  document.getElementById('foodMeal').value=mi>=0?String(mi):'0';
  modal.style.display='flex';
}
function closeFoodModal(evt){
  const modal=document.getElementById('foodModal');
  if(!evt||evt.target===modal)modal.style.display='none';
}
function saveFoodModal(){
  const name=document.getElementById('foodName').value.trim();
  const cal=Number(document.getElementById('foodCal').value);
  const protein=Number(document.getElementById('foodProtein').value);
  const mi=Number(document.getElementById('foodMeal').value);
  if(!name||isNaN(cal)||isNaN(protein)||!state.meals[mi])return alert('Enter food name, calories and protein.');
  state.meals[mi].items.push({name,cal,protein});
  document.getElementById('foodModal').style.display='none';
  persist();
}
function removeFoodByIndex(mi,ii){
  if(state.meals[mi]?.items?.[ii]!==undefined){state.meals[mi].items.splice(ii,1);persist();}
}
function mealTotals(meal){
  return (meal.items||[]).reduce((a,x)=>({cal:a.cal+(Number(x.cal)||0),protein:a.protein+(Number(x.protein)||0)}),{cal:0,protein:0});
}
function nutritionTotals(){
  return state.meals.reduce((a,m)=>{const t=mealTotals(m);return{cal:a.cal+t.cal,protein:a.protein+t.protein}},{cal:0,protein:0});
}
function renderMeals(){
  const el=document.getElementById('mealList');
  if(!el)return;
  el.innerHTML=state.meals.map((m,mi)=>{
    const t=mealTotals(m);
    return `<div class="card"><div class="row"><div><div class="label">${m.name}</div><div class="meal-total">${Math.round(t.cal)} kcal • ${Math.round(t.protein)} g protein</div></div><button class="secondary" onclick="replaceMeal(${mi})">↻</button></div>
    ${(m.items||[]).map((x,ii)=>`<div class="food-row"><div><div class="food-name">${x.name}</div><div class="food-macro">${x.cal} kcal • ${x.protein} g protein</div></div><button class="secondary mini" onclick="removeFoodByIndex(${mi},${ii})">−</button></div>`).join('')}
    <div class="meal-actions"><button class="secondary mini" onclick="openFoodModal(${mi})">＋ Item</button><button class="secondary mini" onclick="replaceMeal(${mi})">Replace Meal</button></div></div>`;
  }).join('');
}
function renderNutrition(){
  const t=nutritionTotals();
  const c=document.getElementById('nCal'),p=document.getElementById('nProtein');
  const cb=document.getElementById('nCalBar'),pb=document.getElementById('nProteinBar');
  if(c)c.textContent=Math.round(t.cal);
  if(p)p.textContent=Math.round(t.protein);
  if(cb)cb.style.width=Math.min(100,t.cal/state.calGoal*100)+'%';
  if(pb)pb.style.width=Math.min(100,t.protein/state.proteinGoal*100)+'%';
}

renderAll();
</script>
