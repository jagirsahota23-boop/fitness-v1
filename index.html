<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d0c">
<title>Fitness V1</title>
<style>
:root{--bg:#0b0d0c;--card:#151917;--card2:#1c211e;--text:#f5f7f6;--muted:#99a29d;--accent:#b7ff3c;--line:#2a302d;--danger:#ff7a7a}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{min-height:100vh}.app{max-width:520px;margin:0 auto;min-height:100vh;padding:18px 16px 95px}
h1{font-size:28px;margin:0}.sub{font-size:13px;color:var(--muted);margin-top:4px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.icon{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:12px;padding:9px 11px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.wide{grid-column:1/-1}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px}.label{color:var(--muted);font-size:12px}
.value{font-size:24px;font-weight:800;margin:6px 0}.goal{font-size:12px;color:var(--muted)}
.progress{height:7px;background:#2a302d;border-radius:99px;overflow:hidden;margin-top:10px}.bar{height:100%;background:var(--accent);width:0}
button{border:0;border-radius:11px;padding:10px 13px;background:var(--accent);color:#10140e;font-weight:800;cursor:pointer}
.secondary{background:var(--card2);border:1px solid var(--line);color:var(--text)}
button:disabled{opacity:.45;cursor:not-allowed}
.screen{display:none}.screen.active{display:block}.list{display:grid;gap:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.pill{border-radius:999px;padding:5px 8px;background:#25301f;color:#ccef9c;font-size:11px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
input,select{width:100%;padding:12px;border-radius:11px;border:1px solid var(--line);background:var(--card2);color:var(--text);font-size:16px;margin:5px 0 12px}
textarea{width:100%;min-height:100px}
.tabs{display:flex;gap:7px;overflow:auto;margin-bottom:10px}.tabs button{white-space:nowrap}
.exercise-title{font-weight:800}.setrow{display:grid;grid-template-columns:48px 1fr 1fr 42px;gap:6px;align-items:center;margin-top:7px}
.setrow input{margin:0;padding:9px}.setnum{color:var(--muted);font-size:12px}.check{padding:9px}
.notice{background:#182218;color:#cdeaa6;border-radius:12px;padding:11px;font-size:12px;margin-top:12px}
nav{position:fixed;bottom:0;left:0;right:0;z-index:10;display:flex;justify-content:center;gap:2px;padding:9px 7px calc(9px + env(safe-area-inset-bottom));background:rgba(11,13,12,.97);border-top:1px solid var(--line)}
nav button{background:transparent;color:var(--muted);font-size:11px;padding:7px 10px}nav button.active{color:var(--accent)}
.small{font-size:11px;color:var(--muted)}.photo-box{height:160px;border:1px dashed #3c443f;border-radius:15px;display:flex;align-items:center;justify-content:center;color:var(--muted)}

.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.68);z-index:50;display:flex;align-items:flex-end}
.sheet{width:100%;max-width:520px;margin:0 auto;background:#171b18;border:1px solid var(--line);border-radius:22px 22px 0 0;padding:18px 16px 26px;max-height:85vh;overflow:auto}
.food-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}
.food-name{font-size:13px}.food-macro{font-size:11px;color:var(--muted)}.mini{padding:7px 9px;font-size:11px}
.meal-total{font-size:12px;color:#cdeaa6;margin-top:5px}.meal-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.choice{margin-top:8px}.choice button{width:100%;text-align:left;background:var(--card2);color:var(--text);border:1px solid var(--line);padding:13px;border-radius:12px}
.qty{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.food-search{display:flex;gap:8px}.food-search input{flex:1;margin:0}.search-results{display:grid;gap:8px;margin-top:12px}.food-result{background:var(--card2);border:1px solid var(--line);border-radius:13px;padding:12px;cursor:pointer}.food-result:hover{border-color:var(--accent)}.food-result b{display:block;font-size:14px}.food-result span{display:block;color:var(--muted);font-size:11px;margin-top:3px}.serving-box{display:grid;grid-template-columns:1fr 1fr;gap:8px}.food-source{font-size:10px;color:var(--muted);margin-top:9px}
.scanner-video{width:100%;max-height:55vh;border-radius:15px;background:#050606;object-fit:cover}.scan-frame{position:relative;margin-top:12px}.scan-frame:after{content:'';position:absolute;left:12%;right:12%;top:46%;border-top:2px solid var(--accent);box-shadow:0 0 0 9999px rgba(0,0,0,.05);pointer-events:none}.scan-status{margin-top:8px;font-size:12px;color:var(--muted)}.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.photo-card{background:var(--card2);border:1px solid var(--line);border-radius:12px;overflow:hidden;min-height:110px}.photo-card img{width:100%;height:110px;object-fit:cover;display:block}.photo-label{font-size:10px;color:var(--muted);padding:6px;text-align:center}.compare-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.compare-card{background:var(--card2);border:1px solid var(--line);border-radius:14px;overflow:hidden}.compare-card img{width:100%;height:230px;object-fit:cover;display:block}.compare-title{padding:8px;font-size:11px;color:var(--muted)}
</head>
<body>
<div class="app">

<section id="today" class="screen active">
  <div class="top">
    <div><h1>Today</h1><div class="sub" id="todayDate"></div></div>
    <button class="icon" onclick="editWeight()">⚖️</button>
  </div>
  <div class="grid">
    <div class="card"><div class="label">Weight</div><div class="value" id="weightVal">83.0 kg</div><div class="goal">Goal: <span id="weightGoal">75</span> kg</div><div class="progress"><div class="bar" id="weightBar"></div></div></div>
    <div class="card"><div class="label">Calories</div><div class="value" id="calVal">0</div><div class="goal">of <span id="calGoal">2300</span> kcal</div><div class="progress"><div class="bar" id="calBar"></div></div></div>
    <div class="card"><div class="label">Protein</div><div class="value" id="proteinVal">0 g</div><div class="goal">of <span id="proteinGoal">150</span> g</div><div class="progress"><div class="bar" id="proteinBar"></div></div></div>
    <div class="card"><div class="label">Steps</div><div class="value" id="stepsVal">0</div><div class="goal">of <span id="stepsGoal">10000</span></div><div class="progress"><div class="bar" id="stepsBar"></div></div></div>
    <div class="card"><div class="label">Water</div><div class="value" id="waterVal">0.0 L</div><div class="goal">Goal: 3.0 L</div><div class="progress"><div class="bar" id="waterBar"></div></div></div>
    <div class="card"><div class="label">Daily score</div><div class="value" id="scoreVal">0%</div><div class="goal">Simple consistency score</div></div>
    <div class="card wide">
      <div class="row">
        <div><div class="label">Today's Workout</div><div class="value" id="todayWorkout">Not started</div><div class="goal">3-day program: Upper / Legs / Upper</div></div>
        <button onclick="showScreen('workout')">OPEN</button>
      </div>
      <div class="actions">
        <button class="secondary" onclick="addWater(.25)">+250 mL</button>
        <button class="secondary" onclick="addSteps(1000)">+1,000 steps</button>
        <button class="secondary" onclick="addProtein(25)">+25 g protein</button>
        <button class="secondary" onclick="addCalories(250)">+250 kcal</button>
      </div>
    </div>
  </div>
  <div class="notice">Your current targets: 83 kg → 75 kg, 2,300 kcal, 150 g protein, 10,000 steps, 3 workouts/week, 2 runs/week, 7 hours sleep.</div>
</section>

<section id="workout" class="screen">
  <div class="top"><div><h1>Workout</h1><div class="sub" id="workoutSub">Upper / Chest Priority</div></div><button class="icon" onclick="resetWorkout()">↻</button></div>
  <div class="tabs">
    <button id="routineA" onclick="setRoutine('A')">A — Upper</button>
    <button id="routineB" class="secondary" onclick="setRoutine('B')">B — Legs</button>
    <button id="routineC" class="secondary" onclick="setRoutine('C')">C — Upper</button>
  </div>
  <div class="card">
    <div class="row"><div><div class="label" id="routineTitle">Upper / Chest Priority</div><div class="goal" id="routineMeta">8 exercises</div></div><span class="pill" id="workoutPill">Not started</span></div>
    <div class="actions"><button onclick="startRoutine()">START WORKOUT</button><button class="secondary" onclick="finishRoutine()">FINISH</button></div>
  </div>
  <div id="exerciseList" class="list" style="margin-top:10px"></div>
  <div class="notice">Warm-up sets are separate and never count toward working-set totals. Secondary movements use 2 working sets after the first exercise has prepared the muscle.</div>
</section>

<section id="nutrition" class="screen">
  <div class="top">
    <div><h1>Nutrition</h1><div class="sub">Your meals • 2,300 kcal • 150 g protein</div></div>
    <div style="display:flex;gap:7px"><button class="secondary" onclick="openScanner()">▣ Scan</button><button class="icon" onclick="openFoodModal(-1)">＋</button></div>
  </div>
  <div class="grid">
    <div class="card">
      <div class="label">Calories</div><div class="value" id="nCal">0</div>
      <div class="goal">of <span id="nCalGoal">2300</span> kcal</div>
      <div class="progress"><div class="bar" id="nCalBar"></div></div>
    </div>
    <div class="card">
      <div class="label">Protein</div><div class="value" id="nProtein">0 g</div>
      <div class="goal">of <span id="nProteinGoal">150</span> g</div>
      <div class="progress"><div class="bar" id="nProteinBar"></div></div>
    </div>
  </div>
  <div id="mealList" class="list" style="margin-top:10px"></div>
  <div class="card" style="margin-top:10px">
    <div class="label">Quick Add</div>
    <div class="goal">Common foods for your routine</div>
    <div class="actions">
      <button class="secondary" onclick="quickFood('Lean Fit Whey',120,23)">Whey • 120 / 23g</button>
      <button class="secondary" onclick="quickFood('3 Whole Eggs',210,18)">Eggs • 210 / 18g</button>
      <button class="secondary" onclick="quickFood('Chicken Breast 180g',297,56)">Chicken • 297 / 56g</button>
    </div>
    <button style="margin-top:10px" onclick="openFoodModal(-1)">＋ ADD FOOD</button>
  </div>
</section>

<section id="progress" class="screen">
  <div class="top">
    <div><h1>Progress</h1><div class="sub">See the change, not just the number</div></div>
  </div>

  <div class="grid">
    <div class="card">
      <div class="label">Current weight</div>
      <div class="value" id="progressWeight">83.0 kg</div>
      <div class="goal">Goal: 75 kg</div>
    </div>
    <div class="card">
      <div class="label">To goal</div>
      <div class="value" id="progressToGoal">8.0 kg</div>
      <div class="goal">Keep stacking good weeks</div>
    </div>
  </div>

  <div class="card" style="margin-top:10px">
    <div class="row"><div><div class="label">Goal journey</div><div class="value" id="progressJourney">0%</div></div><span class="pill" id="progressTrend">Starting point</span></div>
    <div class="progress"><div class="bar" id="progressJourneyBar"></div></div>
  </div>

  <div class="card" style="margin-top:10px">
    <div class="row">
      <div><div class="label">Weekly Check-In</div><div class="value" style="font-size:20px">Photos + measurements</div><div class="goal">Front • Side • Back • weight • waist</div></div>
      <button onclick="openCheckin()">ADD CHECK-IN</button>
    </div>
    <div id="latestPhotoStrip" class="photo-grid" style="margin-top:10px"></div>
  </div>

  <div class="card" style="margin-top:10px">
    <div class="row"><div><div class="label">Compare</div><div class="value" style="font-size:20px">Before & After</div></div></div>
    <div class="actions">
      <select id="compareA" onchange="renderComparison()"></select>
      <select id="compareB" onchange="renderComparison()"></select>
    </div>
    <div id="comparisonArea" style="margin-top:10px"></div>
  </div>

  <div class="card" style="margin-top:10px">
    <div class="label">Strength</div>
    <div class="goal" style="margin-top:6px">Workout progression will appear here automatically.</div>
  </div>
</section>

<section id="profile" class="screen">
  <div class="top"><div><h1>Profile</h1><div class="sub">Goals & preferences</div></div></div>
  <div class="card">
    <div class="label">Current weight (kg)</div><input id="pWeight" type="number" step="0.1">
    <div class="label">Goal weight (kg)</div><input id="pGoalWeight" type="number" step="0.1">
    <div class="label">Daily calories</div><input id="pCal" type="number">
    <div class="label">Daily protein (g)</div><input id="pProtein" type="number">
    <div class="label">Daily steps</div><input id="pSteps" type="number">
    <div class="label">Weekly workouts</div><input id="pWorkouts" type="number">
    <div class="label">Weekly runs</div><input id="pRuns" type="number">
    <div class="label">Sleep goal (hours)</div><input id="pSleep" type="number" step="0.1">
    <button onclick="saveProfile()">SAVE GOALS</button>
  </div>
</section>

</div>

<nav>
<button class="active" onclick="showScreen('today',this)">⌂<br>Today</button>
<button onclick="showScreen('workout',this)">🏋️<br>Workout</button>
<button onclick="showScreen('nutrition',this)">🍎<br>Nutrition</button>
<button onclick="showScreen('progress',this)">📈<br>Progress</button>
<button onclick="showScreen('profile',this)">👤<br>Profile</button>
</nav>




<div id="scannerModal" class="modal-backdrop" style="display:none" onclick="closeScanner(event)">
  <div class="sheet" onclick="event.stopPropagation()">
    <div class="row">
      <div><h2>Scan Barcode</h2><div class="sub">Point your camera at the product barcode.</div></div>
      <button class="secondary" onclick="closeScanner()">✕</button>
    </div>
    <div class="scan-frame">
      <video id="scannerVideo" class="scanner-video" playsinline muted></video>
    </div>
    <div id="scanStatus" class="scan-status">Starting camera…</div>
    <div class="actions" style="margin-top:12px">
      <button class="secondary" onclick="stopScanner()">STOP CAMERA</button>
      <button class="secondary" onclick="manualBarcode()">ENTER BARCODE</button>
    </div>
  </div>
</div>

<div id="foodModal" class="modal-backdrop" style="display:none" onclick="closeFoodModal(event)">
  <div class="sheet" onclick="event.stopPropagation()">
    <div class="row">
      <div><h2>Add Food</h2><div class="sub">Search the food database. You enter the amount; the app handles the macros.</div></div>
      <button class="secondary" onclick="closeFoodModal()">✕</button>
    </div>

    <div class="food-search" style="margin-top:12px">
      <input id="foodSearch" placeholder="Search e.g. banana, chicken breast, Greek yogurt" onkeydown="if(event.key==='Enter')searchFoods()">
      <button onclick="searchFoods()">SEARCH</button>
    </div>

    <div id="foodSearchStatus" class="small" style="margin-top:8px">Search for a food to begin.</div>
    <div id="foodSearchResults" class="search-results"></div>

    <div id="foodSelectedPanel" style="display:none;margin-top:14px">
      <div class="card">
        <div class="row"><div><div class="label">Selected food</div><div class="value" style="font-size:18px" id="selectedFoodName">Food</div><div class="goal" id="selectedFoodBasis"></div></div><button class="secondary" onclick="clearSelectedFood()">Change</button></div>
        <div class="serving-box" style="margin-top:12px"><div><div class="label">Serving size</div><select id="servingPreset" onchange="applyServingPreset()"><option value="30">30 g</option><option value="60">60 g</option><option value="100" selected>100 g</option><option value="custom">Custom</option></select></div>
          <div><div class="label">Amount (g)</div><input id="selectedFoodGrams" type="number" min="1" step="1" value="100"></div>
          <div><div class="label">Meal</div><select id="foodMeal"><option value="0">Breakfast</option><option value="1">Lunch</option><option value="2">Post-workout</option><option value="3">Dinner</option></select></div>
        </div>
        <div class="goal" style="margin-top:8px">Estimated for this amount: <b id="selectedFoodMacros">0 kcal • 0 g protein</b></div>
        <button style="width:100%;margin-top:10px" onclick="addSelectedFood()">ADD TO MEAL</button>
      </div>
    </div>

    <div class="food-source">Food data powered by Open Food Facts. Packaged-product data can vary by brand and serving.</div>
  </div>
</div>
</div>
<div id="mealReplaceModal" class="modal-backdrop" style="display:none" onclick="closeMealReplace(event)">
  <div class="sheet" onclick="event.stopPropagation()">
    <div class="row">
      <div><h2 id="mealReplaceTitle">Replace Meal</h2><div class="sub">Choose a meal for today.</div></div>
      <button class="secondary" onclick="closeMealReplace()">✕</button>
    </div>
    <div id="mealReplaceChoices"></div>
  </div>
</div>
<script src="https://unpkg.com/@zxing/browser@0.2.1"></script>

<div id="checkinModal" class="modal-backdrop" style="display:none" onclick="closeCheckin(event)">
  <div class="sheet" onclick="event.stopPropagation()">
    <div class="row"><div><h2>Weekly Check-In</h2><div class="sub">Take consistent photos each week.</div></div><button class="secondary" onclick="closeCheckin()">✕</button></div>
    <div style="margin-top:12px">
      <div class="label">Weight (kg)</div><input id="checkinWeight" type="number" step="0.1">
      <div class="label">Waist (cm) — optional</div><input id="checkinWaist" type="number" step="0.1">
      <div class="actions">
        <button class="secondary" onclick="captureCheckinPhoto('front')">📸 Front</button>
        <button class="secondary" onclick="captureCheckinPhoto('side')">📸 Side</button>
        <button class="secondary" onclick="captureCheckinPhoto('back')">📸 Back</button>
      </div>
      <div id="checkinStatus" class="small" style="margin-top:8px">0 / 3 photos</div>
      <input id="checkinPhotoInput" type="file" accept="image/*" capture="environment" style="display:none" onchange="saveCheckinPhoto(event)">
      <button style="width:100%;margin-top:12px" onclick="saveCheckin()">SAVE CHECK-IN</button>
    </div>
  </div>
</div>
<script>
const STORE='fitness-v1-real';
let state=JSON.parse(localStorage.getItem(STORE)||'null')||{
 weight:83,goalWeight:75,calGoal:2300,proteinGoal:150,stepsGoal:10000,workoutsGoal:3,runsGoal:2,sleepGoal:7,
 cal:0,protein:0,steps:0,water:0,workoutStatus:{A:'Not started',B:'Not started',C:'Not started'},
 routine:'A',sets:{}
};
const routines={
 A:{
  title:'Upper / Chest Priority',
  ex:[
   ['Incline Dumbbell Press',3,'6–10',true],['Flat Bench Press',2,'6–10',false],['Cable Chest Fly',2,'10–15',false],
   ['Lat Pulldown',3,'8–12',true],['Seated Cable Row',2,'8–12',false],
   ['Dumbbell Lateral Raise',3,'12–15',true],['Triceps Pushdown',3,'10–15',true],['Dumbbell Curl',3,'10–15',true]
  ]},
 B:{
  title:'Legs / Hard Session',
  ex:[
   ['Squat / Hack Squat',3,'6–10',true],['Leg Press',2,'10–12',false],['Leg Extension',2,'10–15',false],
   ['Romanian Deadlift',3,'8–12',true],['Leg Curl',2,'10–15',false],
   ['Calf Raise',3,'10–15',true],['Cable Crunch',2,'10–15',false]
  ]},
 C:{
  title:'Upper / Chest Priority',
  ex:[
   ['Flat Dumbbell Press',3,'6–10',true],['Incline Machine Chest Press',2,'8–12',false],['Cable Fly',2,'10–15',false],
   ['Chest-Supported Row',3,'8–12',true],['Lat Pulldown',2,'8–12',false],
   ['Seated Dumbbell Shoulder Press',3,'8–12',true],['Dumbbell Lateral Raise',2,'12–15',false],
   ['EZ-Bar Curl',3,'10–15',true],['Overhead Cable Triceps Extension',2,'10–15',false]
  ]}
};
const alt={
'Incline Dumbbell Press':['Incline Barbell Press','Incline Smith Machine Press','Incline Machine Chest Press'],
'Flat Bench Press':['Flat Dumbbell Press','Flat Machine Chest Press','Smith Machine Bench Press'],
'Cable Chest Fly':['Pec Deck / Machine Fly','Dumbbell Fly','Cable Crossover'],
'Lat Pulldown':['Assisted Pull-Up','Neutral-Grip Pulldown','Single-Arm Cable Pulldown'],
'Seated Cable Row':['Chest-Supported Row','Machine Row','Single-Arm Cable Row'],
'Dumbbell Lateral Raise':['Cable Lateral Raise','Lateral Raise Machine','Lean-Away Cable Raise'],
'Triceps Pushdown':['Rope Pushdown','Straight-Bar Pushdown','Single-Arm Cable Pushdown'],
'Dumbbell Curl':['EZ-Bar Curl','Cable Curl','Preacher Curl Machine'],
'Squat / Hack Squat':['Barbell Squat','Hack Squat','Smith Machine Squat'],
'Leg Press':['Hack Squat','Belt Squat','Smith Machine Squat'],
'Leg Extension':['Single-Leg Extension'],
'Romanian Deadlift':['Dumbbell Romanian Deadlift','Smith Machine Romanian Deadlift','45-Degree Back Extension'],
'Leg Curl':['Seated Leg Curl','Lying Leg Curl','Single-Leg Curl'],
'Calf Raise':['Seated Calf Raise','Leg Press Calf Raise','Single-Leg Calf Raise'],
'Cable Crunch':['Machine Crunch','Weighted Decline Crunch','Kneeling Rope Crunch'],
'Flat Dumbbell Press':['Flat Barbell Bench Press','Machine Chest Press','Smith Machine Bench Press'],
'Incline Machine Chest Press':['Incline Dumbbell Press','Incline Smith Machine Press','Incline Barbell Press'],
'Cable Fly':['Pec Deck / Machine Fly','Dumbbell Fly','Cable Crossover'],
'Chest-Supported Row':['Seated Cable Row','Machine Row','One-Arm Dumbbell Row'],
'Seated Dumbbell Shoulder Press':['Machine Shoulder Press','Smith Machine Shoulder Press','Arnold Press'],
'EZ-Bar Curl':['Dumbbell Curl','Cable Curl','Preacher Curl Machine'],
'Overhead Cable Triceps Extension':['Dumbbell Overhead Extension','EZ-Bar Skull Crusher','Single-Arm Cable Overhead Extension']
};
function persist(){localStorage.setItem(STORE,JSON.stringify(state));renderAll()}
function pct(a,b){return Math.max(0,Math.min(100,b?Math.round(a/b*100):0))}
function renderAll(){
 todayDate.textContent=new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});
 weightVal.textContent=state.weight.toFixed(1)+' kg';weightGoal.textContent=state.goalWeight;
 calVal.textContent=state.cal;calGoal.textContent=state.calGoal;proteinVal.textContent=state.protein+' g';proteinGoal.textContent=state.proteinGoal;
 stepsVal.textContent=state.steps.toLocaleString();stepsGoal.textContent=state.stepsGoal;waterVal.textContent=state.water.toFixed(1)+' L';
 calBar.style.width=pct(state.cal,state.calGoal)+'%';proteinBar.style.width=pct(state.protein,state.proteinGoal)+'%';stepsBar.style.width=pct(state.steps,state.stepsGoal)+'%';waterBar.style.width=pct(state.water,3)+'%';

let scannerControls=null;
let scannerStream=null;
let scannerActive=false;
async function openScanner(){
  document.getElementById('scannerModal').style.display='flex';
  document.getElementById('scanStatus').textContent='Starting camera…';
  try{
    if(!window.ZXingBrowser){throw new Error('Scanner library unavailable');}
    scannerControls=new ZXingBrowser.BrowserMultiFormatReader();
    const devices=await ZXingBrowser.BrowserCodeReader.listVideoInputDevices();
    if(!devices.length)throw new Error('No camera found');
    const back=devices.find(d=>/back|rear|environment/i.test(d.label))||devices[devices.length-1];
    scannerControls.decodeFromVideoDevice(back.deviceId,'scannerVideo',(result)=>{
      if(result && !scannerActive){return;}
      if(result){
        scannerActive=true;
        const code=result.getText();
        document.getElementById('scanStatus').textContent='Barcode found: '+code;
        stopScanner(false);
        lookupBarcode(code);
      }
    }).then(controls=>{scannerStream=controls;scannerActive=true;document.getElementById('scanStatus').textContent='Scanning…';})
      .catch(err=>{console.error(err);document.getElementById('scanStatus').textContent='Camera could not start. Try Enter Barcode.';});
  }catch(e){
    document.getElementById('scanStatus').textContent='Camera scanning is unavailable here. Try Enter Barcode.';
  }
}
function stopScanner(hide=true){
  try{scannerStream?.stop();}catch(e){}
  try{scannerControls?.reset();}catch(e){}
  scannerStream=null;scannerControls=null;
  const v=document.getElementById('scannerVideo');
  if(v?.srcObject){v.srcObject.getTracks().forEach(t=>t.stop());v.srcObject=null;}
  if(hide)document.getElementById('scannerModal').style.display='none';
  document.getElementById('scanStatus').textContent='Ready';
}

async function lookupBarcode(code){
  if(!/^\d{6,14}$/.test(code)){alert('That does not look like a valid barcode.');return;}
  try{
    const url='https://world.openfoodfacts.org/api/v2/product/'+encodeURIComponent(code)+'?fields=code,product_name,brands,nutriments,serving_size';
    const res=await fetch(url,{headers:{'Accept':'application/json'}});
    if(!res.ok)throw new Error('Lookup failed');
    const data=await res.json();
    if(data.status!==1 || !data.product){alert('Product not found in Open Food Facts. You can add it as a Custom Food.');return;}
    const n=data.product.nutriments||{};
    const kcal=Number(n['energy-kcal_100g'] ?? n['energy_kcal_100g'] ?? 0);
    const protein=Number(n['proteins_100g'] ?? 0);
    selectedFood={name:(data.product.product_name||'Scanned Product')+(data.product.brands?' ('+data.product.brands+')':''),kcal100:kcal,protein100:protein,servingSize:data.product.serving_size||''};
    document.getElementById('selectedFoodName').textContent=selectedFood.name;
    document.getElementById('selectedFoodBasis').textContent=`${Math.round(kcal)} kcal • ${protein.toFixed(1)} g protein per 100 g`+(selectedFood.servingSize?` • Label serving: ${selectedFood.servingSize}`:'');
    document.getElementById('selectedFoodGrams').value=100;
    document.getElementById('foodMeal').value=String(window.addFoodMeal||0);
    document.getElementById('foodSelectedPanel').style.display='block';
    updateSelectedMacros();
    document.getElementById('foodModal').style.display='flex';
  }catch(e){
    alert('Could not look up that barcode right now. You can enter the product as Custom Food.');
  }
}

  const a=document.getElementById('compareA'),b=document.getElementById('compareB'),area=document.getElementById('comparisonArea');
  if(checks.length<2){area.innerHTML='<div class="small">Save at least two weekly check-ins to compare photos.</div>';return;}
  const left=checks[Number(a.value)||0],right=checks[Number(b.value)||checks.length-1];
  area.innerHTML=['front','side','back'].map(t=>`<div class="compare-grid" style="margin-top:8px"><div class="compare-card">${left.photos?.[t]?`<img src="${left.photos[t]}">`:''}<div class="compare-title">${left.date} • ${t.toUpperCase()}</div></div><div class="compare-card">${right.photos?.[t]?`<img src="${right.photos[t]}">`:''}<div class="compare-title">${right.date} • ${t.toUpperCase()}</div></div></div>`).join('')+
    `<div class="notice">Weight: ${left.weight.toFixed(1)} kg → ${right.weight.toFixed(1)} kg • Change: ${(right.weight-left.weight).toFixed(1)} kg</div>`;
}

renderAll();
</script>
</body>
</html>
